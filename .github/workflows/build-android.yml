name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ── 1. 의존성 설치 ────────────────────────
      - name: Install dependencies
        working-directory: app
        run: npm ci

      # ── 2. Expo → android/ 생성 ───────────────
      # android/ 는 gitignore → CI에서 매번 재생성
      - name: Expo prebuild (Android)
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      # ── 3. 키스토어 복원 ──────────────────────
      - name: Decode keystore
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/keystore.jks
          echo "keystore size: $(wc -c < android/app/keystore.jks) bytes"

      # ── 4. 서명 설정 주입 ─────────────────────
      # expo prebuild가 생성한 build.gradle에 signingConfigs 추가
      - name: Inject signing config into build.gradle
        working-directory: app
        shell: python3 {0}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          import re, os
          path = "android/app/build.gradle"
          content = open(path).read()

          signing = f"""    signingConfigs {{
              release {{
                  storeFile file("keystore.jks")
                  storePassword "{os.environ['KEYSTORE_PASSWORD']}"
                  keyAlias "{os.environ['KEY_ALIAS']}"
                  keyPassword "{os.environ['KEY_PASSWORD']}"
              }}
          }}
          """
          # signingConfigs 블록이 없을 경우만 삽입
          if "signingConfigs" not in content:
              content = content.replace("    buildTypes {", signing + "    buildTypes {", 1)

          # release buildType에 signingConfig 참조 추가
          if "signingConfig signingConfigs.release" not in content:
              content = re.sub(
                  r"(buildTypes\s*\{[^}]*?release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release",
                  content, count=1, flags=re.DOTALL
              )

          open(path, "w").write(content)
          print("build.gradle patched ✓")

      # ── 5. APK 빌드 ───────────────────────────
      - name: Build release APK
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
        run: gradle :app:assembleRelease

      # ── 6. APK 이름 변경 ─────────────────────
      - name: Rename APK
        run: |
          TAG=${GITHUB_REF_NAME:-build-${{ github.run_number }}}
          mv app/android/app/build/outputs/apk/release/app-release.apk \
             app/android/app/build/outputs/apk/release/gom-homework-${TAG}.apk

      # ── 7. Artifact 업로드 (항상) ─────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: app/android/app/build/outputs/apk/release/*.apk

      # ── 8. GitHub Release 생성 (태그 push 시) ──
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
