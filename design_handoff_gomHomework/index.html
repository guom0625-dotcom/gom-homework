  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>gomHomework · 디자인 캔버스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    html, body { margin: 0; padding: 0; background: #f0eee9; font-family: 'Noto Sans KR', system-ui, sans-serif; }
    /* Strip artboard white bg so phone frame's own colors show through cleanly */
    .phone-board > .dc-card { background: transparent !important; box-shadow: none !important; }
    /* Link-pin style for the live prototype callout */
    .live-pin {
      position: absolute; right: 24px; top: 20px;
      background: linear-gradient(135deg, #ff8855, #ff5a7a);
      color: #fff; padding: 14px 18px; border-radius: 16px;
      text-decoration: none; font-weight: 600; font-size: 14px;
      font-family: 'Jua', system-ui, sans-serif;
      box-shadow: 0 4px 0 rgba(196,48,79,.5), 0 12px 30px rgba(255,107,107,.4);
      z-index: 100; display: inline-flex; align-items: center; gap: 8px;
      transition: transform .12s;
    }
    .live-pin:active { transform: translateY(2px); }
    .live-pin .arrow { font-size: 16px; }
  </style>
</head>
<body>
  <a class="live-pin" href="live.html" target="_blank">
    🎮 라이브 프로토타입 <span class="arrow">→</span>
  </a>

  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="android-frame.jsx"></script>
  <script src="image-slot.js"></script>
  <script type="text/babel" src="components/shared.jsx"></script>
  <script type="text/babel" src="components/student-screens.jsx"></script>
  <script type="text/babel" src="components/manager-screens.jsx"></script>
  <script type="text/babel" src="components/manager-rules.jsx"></script>
  <script type="text/babel" src="components/spend-screens.jsx"></script>
  <script type="text/babel" src="components/main-variations.jsx"></script>
  <script type="text/babel" src="components/game-screens.jsx"></script>

  <script type="text/babel" data-presets="react">
    // Phone wrapper — drops the artboard's white bg so the phone frame
    // is the only visible chrome.
    const Phone = ({ children }) => (
      <div style={{
        width: 412, height: 892,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      }}>
        <AndroidDevice width={412} height={892}>
          {children}
        </AndroidDevice>
      </div>
    );

    function App() {
      return (
        <DesignCanvas>
          {/* ───────── SECTION: 메인 화면 변형 ───────── */}
          <DCSection
            id="main-variants"
            title="메인 화면 · 징검다리 진행도"
            subtitle="섬에서 섬으로 건너는 4가지 시각 변형. 학생 캐릭터가 현재 일(Day)의 섬에 위치">
            <DCArtboard id="v-horizontal" label="A · 가로 바다 지도" width={412} height={892}>
              <Phone><MainHorizontal currentDay={7} status="pending"/></Phone>
            </DCArtboard>
            <DCArtboard id="v-vertical" label="B · 세로 S-경로" width={412} height={892}>
              <Phone><MainVertical currentDay={7} status="pending"/></Phone>
            </DCArtboard>
            <DCArtboard id="v-archipelago" label="C · 위에서 본 아키펠라고" width={412} height={892}>
              <Phone><MainArchipelago currentDay={7} status="pending"/></Phone>
            </DCArtboard>
            <DCArtboard id="v-board" label="D · 30일 보드게임" width={412} height={892}>
              <Phone><MainBoard currentDay={7} status="pending"/></Phone>
            </DCArtboard>
            <DCPostIt top={-40} left={-10} rotate={-3} width={200}>
              4가지 모두 동일한 데이터(currentDay, status, character) 받음 — 시각 처리만 다름.
              개인적으로는 A(가로)나 B(세로)가 모험감이 강함
            </DCPostIt>
          </DCSection>

          {/* ───────── SECTION: 진행 상태별 메인 화면 (A 기준) ───────── */}
          <DCSection
            id="main-states"
            title="메인 화면 · 4가지 상태"
            subtitle="A 레이아웃 기준으로 본 상태별 변화 — 캐릭터 표정/하단 액션/배너가 달라짐">
            <DCArtboard id="s-todo" label="① 할일 등록 전" width={412} height={892}>
              <Phone><MainHorizontal currentDay={7} status="todo" gems={94}/></Phone>
            </DCArtboard>
            <DCArtboard id="s-pending" label="② 검토 대기 중" width={412} height={892}>
              <Phone><MainHorizontal currentDay={7} status="pending" gems={94}/></Phone>
            </DCArtboard>
            <DCArtboard id="s-approved" label="③ 승인 완료" width={412} height={892}>
              <Phone><MainHorizontal currentDay={7} status="approved" gems={124}/></Phone>
            </DCArtboard>
            <DCArtboard id="s-complete" label="④ 오늘 완료 🎉" width={412} height={892}>
              <Phone><MainHorizontal currentDay={8} status="complete" gems={124}/></Phone>
            </DCArtboard>
          </DCSection>

          {/* ───────── SECTION: 학생 플로우 ───────── */}
          <DCSection
            id="student-flow"
            title="학생 플로우"
            subtitle="로그인 → 할일 등록 → 검토 대기 → 보상 → 프로필">
            <DCArtboard id="login" label="로그인 / 계정 선택" width={412} height={892}>
              <Phone><LoginScreen/></Phone>
            </DCArtboard>
            <DCArtboard id="register" label="오늘의 할일 등록" width={412} height={892}>
              <Phone><TaskRegisterScreen/></Phone>
            </DCArtboard>
            <DCArtboard id="pending" label="검토 대기 상태" width={412} height={892}>
              <Phone><PendingScreen/></Phone>
            </DCArtboard>
            <DCArtboard id="rewards" label="포인트 · 보상" width={412} height={892}>
              <Phone><RewardsScreen/></Phone>
            </DCArtboard>
            <DCArtboard id="profile" label="프로필 / 설정" width={412} height={892}>
              <Phone><ProfileScreen/></Phone>
            </DCArtboard>
          </DCSection>

          {/* ───────── SECTION: 매니저 플로우 ───────── */}
          <DCSection
            id="manager-flow"
            title="매니저 플로우"
            subtitle="규칙 설정 → 학생 알림 → 직접 검사 → 자동 지급">
            <DCArtboard id="m-dashboard" label="대시보드 (규칙 진입점 포함)" width={412} height={892}>
              <Phone><ManagerDashboard/></Phone>
            </DCArtboard>
            <DCArtboard id="m-rules" label="⚙️ 자동 지급 규칙 설정" width={412} height={892}>
              <Phone><AutoRewardsScreen/></Phone>
            </DCArtboard>
            <DCArtboard id="m-approval" label="할일 확인 (직접 검사)" width={412} height={892}>
              <Phone><ApprovalScreen/></Phone>
            </DCArtboard>
            <DCArtboard id="m-grant-result" label="자동 지급 결과 + 추가 보너스" width={412} height={892}>
              <Phone><AutoGrantResultScreen/></Phone>
            </DCArtboard>
            <DCPostIt top={-40} right={20} rotate={2} width={240}>
              ★ 한 번 규칙을 설정해두면 매번 수동 지급할 필요 없음.
              매니저는 검사하고 ✓만 누르면 끝 — 그날의 보너스를 추가하고 싶을 때만 손댐
            </DCPostIt>
          </DCSection>

          {/* ───────── SECTION: 보상 사용 흐름 ───────── */}
          <DCSection
            id="spend-flow"
            title="보상 사용하기 흐름"
            subtitle="학생이 협의된 보상 선택 → 매니저 승인 → 보석 차감 → 잔액 확인">
            <DCArtboard id="catalog" label="매니저 · 보상 카탈로그 관리" width={412} height={892}>
              <Phone><RewardCatalogScreen/></Phone>
            </DCArtboard>
            <DCArtboard id="spend" label="학생 · 보상 사용 선택" width={412} height={892}>
              <Phone><SpendScreen/></Phone>
            </DCArtboard>
            <DCArtboard id="spend-pending" label="학생 · 사용 요청 대기" width={412} height={892}>
              <Phone><SpendPendingScreen/></Phone>
            </DCArtboard>
            <DCArtboard id="spend-approval" label="매니저 · 사용 요청 승인" width={412} height={892}>
              <Phone><SpendApprovalScreen/></Phone>
            </DCArtboard>
            <DCArtboard id="spend-done" label="학생 · 사용 완료 + 잔액" width={412} height={892}>
              <Phone><SpendDoneScreen/></Phone>
            </DCArtboard>
            <DCPostIt top={-40} left={-10} rotate={-2} width={240}>
              ★ 사용은 <b>보석 갯수 단위</b>로 가격 책정.
              잔액 표시는 포인트(pt)로 환산. 매니저가 카탈로그를 미리 만들어두면
              학생은 거기 있는 보상만 사용 가능
            </DCPostIt>
          </DCSection>

          {/* ───────── SECTION: 게임 요소 ───────── */}
          <DCSection
            id="game-elements"
            title="게임 요소 · 보너스 / 컬렉션 / 커스터마이즈"
            subtitle="7일마다 보너스 섬, 업적 배지, 캐릭터 꾸미기로 동기부여">
            <DCArtboard id="bonus" label="보너스 섬 (Day 7 도착)" width={412} height={892}>
              <Phone><BonusScreen day={7}/></Phone>
            </DCArtboard>
            <DCArtboard id="bonus-21" label="보너스 섬 (Day 21)" width={412} height={892}>
              <Phone><BonusScreen day={21} character="fox"/></Phone>
            </DCArtboard>
            <DCArtboard id="achievements" label="업적 컬렉션" width={412} height={892}>
              <Phone><AchievementsScreen/></Phone>
            </DCArtboard>
            <DCArtboard id="customize" label="캐릭터 꾸미기 (얼굴 사진)" width={412} height={892}>
              <Phone><CustomizeScreen/></Phone>
            </DCArtboard>
            <DCPostIt top={-40} left={-10} rotate={-2} width={220}>
              "내 얼굴 사진 쓰기" 토글을 켜면 캐릭터 얼굴에 본인 사진이 들어가요.
              7/14/21/30일 도착시 보너스 섬 자동 출현
            </DCPostIt>
          </DCSection>
        </DesignCanvas>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
